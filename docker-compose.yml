# Runs the pre-built image on the VPS. CI builds and pushes the image;
# this file only pulls and runs it. NEXT_PUBLIC_* values are already baked
# into the image at build time — this only needs runtime secrets.
#
# On the server, create a `.env` file next to this one containing:
#   RESEND_API_KEY=your-key-here   (optional — omit to use the mailto fallback)
services:
  web:
    image: ghcr.io/noor409/bitrms_in_website:latest
    container_name: bitrms-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env

  # Reverse proxy binding new.bitrms.in to the web service, with automatic
  # HTTPS (Let's Encrypt) — see Caddyfile. Requires ports 80/443 open on the
  # VPS and the DNS A record already pointing at this server.
  caddy:
    image: caddy:2-alpine
    container_name: bitrms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
